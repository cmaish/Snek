<!doctype html>
<html><body style="margin:0;background:#4a3cc4">
<canvas id="c"></canvas>
<script type="module">
// Dev gallery of every character head (open via a local server).
import { HEAD_DEFS, drawCharHead } from '../public/js/heads.js';
import { drawFace, ballSprite } from '../public/js/render.js';
const ids = Object.keys(HEAD_DEFS);
const cols = 7, cell = 150, rows = Math.ceil(ids.length / cols);
const c = document.getElementById('c');
c.width = cols * cell; c.height = rows * cell;
const g = c.getContext('2d');
const skin = { colors: ['#1fd17a', '#0b7a43'], eyes: 'round', hat: 'none' };
ids.forEach((id, i) => {
  const x = (i % cols) * cell + cell / 2, y = Math.floor(i / cols) * cell + cell / 2 + 10;
  if (HEAD_DEFS[id].classic) { g.drawImage(ballSprite('#5be37d'), x - 34, y - 34, 68, 68); drawFace(g, x, y, 34, -Math.PI / 2, { eyes: 'cute', hat: 'none', colors: ['#5be37d'] }, {}); }
  else drawCharHead(g, x, y, 34, id, skin, { look: 0.6, t: 0, mouth: i % 5 === 0 ? 1 : 0 });
  g.fillStyle = '#fff'; g.font = 'bold 13px sans-serif'; g.textAlign = 'center';
  g.fillText(HEAD_DEFS[id].name, x, y + 62);
});
document.title = 'done';
</script></body></html>
